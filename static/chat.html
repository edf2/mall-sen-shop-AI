<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky AI 智能助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f2f5; height: 100vh; display: flex; justify-content: center; align-items: center;
  }
  .chat-container {
    width: 420px; height: 620px; background: #fff; border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden;
  }
  .chat-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center;
  }
  .chat-header-left h1 { font-size: 18px; font-weight: 600; }
  .chat-header-left p { font-size: 13px; opacity: 0.85; margin-top: 4px; }
  .chat-header-actions { display: flex; gap: 6px; }
  .chat-header .btn-icon {
    width: 34px; height: 34px; border: none; background: rgba(255,255,255,0.15);
    color: #fff; border-radius: 8px; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center; transition: background 0.2s;
  }
  .chat-header .btn-icon:hover { background: rgba(255,255,255,0.3); }

  .chat-messages {
    flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
  }
  .message {
    max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6;
    word-break: break-word; animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .message.user {
    background: #667eea; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px;
  }
  .message.bot {
    background: #f0f2f5; color: #1a1a2e; align-self: flex-start; border-bottom-left-radius: 4px;
  }
  .message.bot.typing::after {
    content: ""; display: inline-block; width: 8px; height: 16px;
    background: #667eea; margin-left: 4px; animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .message .time {
    font-size: 11px; opacity: 0.6; margin-top: 4px; display: block;
  }
  .message.user .time { text-align: right; }
  .chat-input {
    display: flex; padding: 12px 16px; border-top: 1px solid #e8e8e8; background: #fff; gap: 8px;
  }
  .chat-input input {
    flex: 1; padding: 10px 14px; border: 1px solid #e0e0e0; border-radius: 24px;
    font-size: 14px; outline: none; transition: border-color 0.2s;
  }
  .chat-input input:focus { border-color: #667eea; }
  .chat-input button {
    padding: 10px 20px; border: none; border-radius: 24px; background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; font-size: 14px; cursor: pointer; transition: opacity 0.2s;
  }
  .chat-input button:hover { opacity: 0.9; }
  .chat-input button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── Modal ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    z-index: 1000; justify-content: center; align-items: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff; border-radius: 12px; width: 520px; max-width: 90vw;
    max-height: 80vh; display: flex; flex-direction: column;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .modal-header {
    padding: 16px 24px; border-bottom: 1px solid #e8e8e8;
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-header h3 { font-size: 16px; font-weight: 600; }
  .modal-close {
    width: 32px; height: 32px; border: none; background: none;
    font-size: 20px; cursor: pointer; color: #999; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { background: #f5f5f5; color: #333; }
  .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
  .modal-footer {
    padding: 12px 24px; border-top: 1px solid #e8e8e8;
    display: flex; justify-content: flex-end; gap: 8px;
  }

  .history-list { max-height: 400px; overflow-y: auto; }
  .history-item {
    padding: 14px 16px; border: 1px solid #f0f0f0; border-radius: 8px;
    margin-bottom: 8px; cursor: pointer; transition: background 0.2s;
  }
  .history-item:hover { background: #f5f5f5; }
  .history-item .hi-time { font-size: 12px; color: #999; margin-bottom: 4px; }
  .history-item .hi-preview { font-size: 14px; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-item .hi-meta { font-size: 12px; color: #999; margin-top: 4px; }

  .history-detail-msg { margin-bottom: 12px; }
  .history-detail-msg .hdm-role { font-size: 12px; color: #999; margin-bottom: 2px; }
  .history-detail-msg .hdm-content {
    padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.6;
    background: #f0f2f5; color: #1a1a2e;
  }
  .history-detail-msg.hdm-user .hdm-content { background: #667eea; color: #fff; }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="chat-header-left">
      <h1>Sky AI 智能助手</h1>
      <p>基于 LangGraph ReAct 智能体 · 通义千问驱动</p>
    </div>
    <div class="chat-header-actions">
      <button class="btn-icon" onclick="newConversation()" title="新建对话">➕</button>
      <button class="btn-icon" onclick="openHistoryModal()" title="历史会话">📋</button>
    </div>
  </div>
  <div class="chat-messages" id="messages">
    <div class="message bot">
      你好！我是 Sky AI 智能助手。问我任何问题，比如"现在几点了？" 📅
      <span class="time">刚刚</span>
    </div>
  </div>
  <div class="chat-input">
    <input type="text" id="input" placeholder="输入你的问题..." autofocus>
    <button id="sendBtn">发送</button>
  </div>
</div>

<!-- ── 历史会话 Modal ── -->
<div class="modal-overlay" id="historyModal">
  <div class="modal">
    <div class="modal-header">
      <h3>📋 历史会话</h3>
      <button class="modal-close" onclick="closeHistoryModal()">✕</button>
    </div>
    <div class="modal-body">
      <div id="historyList" class="history-list"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeHistoryModal()" style="padding:8px 20px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;cursor:pointer;">关闭</button>
    </div>
  </div>
</div>

<!-- ── 会话详情 Modal ── -->
<div class="modal-overlay" id="historyDetailModal">
  <div class="modal" style="width:600px;">
    <div class="modal-header">
      <h3>💬 会话详情</h3>
      <button class="modal-close" onclick="closeHistoryDetailModal()">✕</button>
    </div>
    <div class="modal-body" id="historyDetailBody"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeHistoryDetailModal()" style="padding:8px 20px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;cursor:pointer;">关闭</button>
    </div>
  </div>
</div>

<script>
const API_URL = 'http://localhost:8100/agent/chat/stream';
const SESSION_API = 'http://localhost:8100/agent/sessions';

// ── Session ID 持久化 ──
function getSessionId() {
  let sid = localStorage.getItem('user_session_id');
  if (!sid) {
    sid = 'web-' + Date.now();
    localStorage.setItem('user_session_id', sid);
  }
  return sid;
}

function newConversation() {
  if (!confirm('确定要开始新对话吗？当前对话将被保存。')) return;
  const sid = 'web-' + Date.now();
  localStorage.setItem('user_session_id', sid);
  document.getElementById('messages').innerHTML = `
    <div class="message bot">
      你好！我是 Sky AI 智能助手。问我任何问题，比如"现在几点了？" 📅
      <span class="time">刚刚</span>
    </div>
  `;
}

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

function addMessage(text, role, showTime = true) {
  const div = document.createElement('div');
  div.className = 'message ' + role;
  if (text) div.textContent = text;
  if (showTime) {
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    div.appendChild(time);
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'message bot typing';
  div.textContent = '思考中';
  div.id = 'typing';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

async function loadChatHistory() {
  const sessionId = getSessionId();
  try {
    const res = await fetch(`${SESSION_API}/${sessionId}/messages`);
    const json = await res.json();
    if (json.code === 1 && json.data.length > 0) {
      messagesEl.innerHTML = '';
      for (const m of json.data) {
        if (m.type === 'human' || m.type === 'ai') {
          const role = m.type === 'human' ? 'user' : 'bot';
          const content = m.data?.content || '';
          if (!content) continue;
          addMessage(content, role);
        }
      }
    }
  } catch (e) { /* ignore */ }
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  sendBtn.disabled = true;
  addMessage(text, 'user');
  showTyping();
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: getSessionId() })
    });
    removeTyping();
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let botDiv = addMessage('', 'bot', false);
    let buffer = '';
    outer:
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const data = line.slice(6);
          if (data === '[DONE]') break outer;
          try {
            const parsed = JSON.parse(data);
            botDiv.textContent += parsed.token;
            messagesEl.scrollTop = messagesEl.scrollHeight;
          } catch (e) { /* skip partial JSON */ }
        }
      }
    }
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    botDiv.appendChild(time);
  } catch (err) {
    removeTyping();
    addMessage('连接失败，请确认 Python 服务是否运行在 ' + API_URL, 'bot');
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

// ── 历史会话 ──
async function openHistoryModal() {
  document.getElementById('historyModal').classList.add('show');
  document.getElementById('historyList').innerHTML = '<div style="text-align:center;padding:24px;color:#999;">加载中...</div>';
  try {
    const res = await fetch(`${SESSION_API}?role=user&limit=50`);
    const json = await res.json();
    if (json.code !== 1) throw new Error(json.msg || '加载失败');
    const sessions = json.data;
    const container = document.getElementById('historyList');
    if (!sessions.length) {
      container.innerHTML = '<div style="text-align:center;padding:24px;color:#999;">暂无历史会话</div>';
      return;
    }
    container.innerHTML = sessions.map(s => `
      <div class="history-item" onclick="openHistoryDetail('${s.session_id}')">
        <div class="hi-time">${formatTime(s.created_at)}</div>
        <div class="hi-preview">${s.preview || '(空)'}</div>
        <div class="hi-meta">共 ${s.message_count} 条消息</div>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('historyList').innerHTML = '<div style="text-align:center;padding:24px;color:#ff4d4f;">加载失败: ' + e.message + '</div>';
  }
}

function closeHistoryModal() {
  document.getElementById('historyModal').classList.remove('show');
}

function formatTime(ts) {
  const d = new Date(ts * 1000);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

async function openHistoryDetail(sessionId) {
  closeHistoryModal();
  document.getElementById('historyDetailModal').classList.add('show');
  document.getElementById('historyDetailBody').innerHTML = '<div style="text-align:center;padding:24px;color:#999;">加载中...</div>';
  try {
    const res = await fetch(`${SESSION_API}/${sessionId}/messages`);
    const json = await res.json();
    if (json.code !== 1) throw new Error(json.msg || '加载失败');
    const messages = json.data;
    const container = document.getElementById('historyDetailBody');
    if (!messages.length) {
      container.innerHTML = '<div style="text-align:center;padding:24px;color:#999;">暂无消息</div>';
      return;
    }
    container.innerHTML = messages.map(m => {
      const role = m.type === 'human' ? '用户' : (m.type === 'ai' ? 'AI' : m.type);
      const content = m.data?.content || '';
      if (!content) return '';
      const cls = m.type === 'human' ? 'hdm-user' : '';
      return `
        <div class="history-detail-msg ${cls}">
          <div class="hdm-role">${role}</div>
          <div class="hdm-content">${escapeHtml(content)}</div>
        </div>
      `;
    }).join('');
  } catch (e) {
    document.getElementById('historyDetailBody').innerHTML = '<div style="text-align:center;padding:24px;color:#ff4d4f;">加载失败: ' + e.message + '</div>';
  }
}

function closeHistoryDetailModal() {
  document.getElementById('historyDetailModal').classList.remove('show');
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ── 加载历史消息 ──
loadChatHistory();
</script>
</body>
</html>
