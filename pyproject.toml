[project]
name = "mall-sen-shop-ai"
version = "0.1.0"
description = "MALL森百货 AI 智能体服务（商家分析助手 + 用户智能客服）"
requires-python = ">=3.10"
dependencies = [
    # ── AI 与 LangChain/LangGraph 生态 ─────────────────────────────
    # 版本策略：锁定在 langgraph-checkpoint 2.0.21 世代 —— 它是最后一个
    # 不依赖 ormsgpack 的版本。原因：本机 Windows 智能应用控制(SAC)会拦截
    # 未签名的原生扩展（ormsgpack/pandas 等），2.0.22+ 引入 ormsgpack 后
    # langgraph 无法加载。关闭 SAC 后可放开这些上限并升级。
    "langchain>=0.3.27,<0.4",
    "langchain-community>=0.3.31,<0.4",
    "langchain-core>=0.3.86,<0.4",
    "langchain-openai>=0.3.35,<0.4",
    "langchain-tavily>=0.2.17,<0.3",
    "langgraph>=0.4.3,<0.4.5",
    "langgraph-checkpoint>=2.0.21,<2.0.22",  # 精确锁 2.0.21：最后一个不依赖 ormsgpack 的版本，2.0.22 起必装
    "langgraph-checkpoint-sqlite>=2.0.11,<3",
    # 可观测性：Phoenix 的依赖链含 pandas（C 扩展当前被 SAC 拦截），
    # 运行时由 agent/observability.py 三层 fail-safe 自动降级；
    # 关闭 SAC 后无需改代码即自动启用。
    "arize-phoenix>=19",
    "openinference-instrumentation-langchain>=0.1",
    # ── Web 与业务依赖 ─────────────────────────────────────────────
    "alibabacloud-oss-v2>=1.3.1",
    "dashscope>=1.25.19",
    "fastapi>=0.136.3",
    "ipywidgets>=8.1.8",
    "notebook>=7.5.6",
    "openai>=2.38.0",
    "python-dotenv>=1.2.2",
    "redis>=8.0.0",
    "uvicorn[standard]>=0.30.6",
    "nacos-sdk-python>=0.1.14,<2",  # 1.x 保持 import nacos 旧 API；2.x+ 改为 v2.nacos，与现有代码不兼容
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
